version: '3.8'

services:
    mysqldb:
        image: mysql:8.0
        container_name: ipl_auction_db
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: ipl_auction_db
            MYSQL_USER: auction_user
            MYSQL_PASSWORD: auction_password
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql

volumes:
    db_data:
