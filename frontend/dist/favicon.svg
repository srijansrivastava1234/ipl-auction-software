<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Cyan glow background -->
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <!-- Reactor Core Gradient (Hot Magenta to Orange) -->
    <radialGradient id="reactorCore" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="60%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#330000"/>
    </radialGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#cyberBg)"/>

  <!-- Concentric Orbital Circuit Rings -->
  <circle cx="50" cy="50" r="45" stroke="#00f2fe" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.6"/>
  <circle cx="50" cy="50" r="38" stroke="#05ffa1" stroke-width="1.2" stroke-dasharray="12 4" opacity="0.8"/>
  <circle cx="50" cy="50" r="29" stroke="#ff0077" stroke-width="0.5" stroke-dasharray="1 3" opacity="0.5"/>

  <!-- Circuit nodes / Synapse connections -->
  <g stroke="#05ffa1" stroke-width="1" opacity="0.75">
    <line x1="50" y1="12" x2="50" y2="29"/>
    <line x1="50" y1="88" x2="50" y2="71"/>
    <line x1="12" y1="50" x2="29" y2="50"/>
    <line x1="88" y1="50" x2="71" y2="50"/>
    
    <line x1="23" y1="23" x2="35" y2="35"/>
    <line x1="77" y1="23" x2="65" y2="35"/>
    <line x1="23" y1="77" x2="35" y2="65"/>
    <line x1="77" y1="77" x2="65" y2="65"/>
  </g>

  <!-- Synapse connection dots -->
  <circle cx="50" cy="12" r="2.5" fill="#05ffa1"/>
  <circle cx="50" cy="88" r="2.5" fill="#05ffa1"/>
  <circle cx="12" cy="50" r="2.5" fill="#05ffa1"/>
  <circle cx="88" cy="50" r="2.5" fill="#05ffa1"/>
  <circle cx="23" cy="23" r="2" fill="#00f2fe"/>
  <circle cx="77" cy="23" r="2" fill="#00f2fe"/>
  <circle cx="23" cy="77" r="2" fill="#00f2fe"/>
  <circle cx="77" cy="77" r="2" fill="#00f2fe"/>

  <!-- Central Sci-Fi Reactor Shield -->
  <circle cx="50" cy="50" r="23" fill="rgba(2, 4, 10, 0.95)" stroke="#00f2fe" stroke-width="1.8" filter="url(#cyberGlow)"/>

  <!-- Cyber Cricket Ball Reactor Core -->
  <circle cx="50" cy="50" r="16" fill="url(#reactorCore)" stroke="#ff0077" stroke-width="2" filter="url(#cyberGlow)"/>
  
  <!-- Digital/Holographic Cricket Seam (representing the cricket integration) -->
  <path d="M 36 46 Q 50 36 64 46 Q 50 56 36 46 Z" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="2 1.5" fill="none" opacity="0.9"/>
  <path d="M 36 54 Q 50 44 64 54 Q 50 64 36 54 Z" stroke="#05ffa1" stroke-width="1.2" stroke-dasharray="2 1.5" fill="none" opacity="0.9"/>
</svg>