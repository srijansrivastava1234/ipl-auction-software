server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: ipl-auction-backend
  datasource:
    url: jdbc:h2:mem:ipl_auction_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console

# Springdoc OpenAPI / Swagger UI Settings
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
